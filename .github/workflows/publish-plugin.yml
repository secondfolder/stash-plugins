name: Publish plugin

# Adds or updates a plugin from a GitHub release of the plugin's own repo, then deploys the site. Plugin repos trigger
# this after releasing with a repository_dispatch event, e.g.:
#   gh api repos/secondfolder/stash-plugins/dispatches -f event_type=publish-plugin \
#     -f 'client_payload[repo]=secondfolder/stash-tv' -f 'client_payload[tag]=v1.2.3'
# (the token used needs write access to this repo's contents)

on:
  repository_dispatch:
    types: [publish-plugin]

  # Allows publishing a release manually from the Actions tab
  workflow_dispatch:
    inputs:
      repo:
        description: The plugin's GitHub repo (e.g. secondfolder/stash-tv)
        required: true
      tag:
        description: The release's tag (e.g. v1.2.3)
        required: true
      asset:
        description: The name of the plugin zip asset (only needed if the release has more than one zip)
        required: false

# Only update one plugin at a time so pushes don't conflict
concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      ASSET: ${{ github.event.client_payload.asset || inputs.asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write plugin manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-plugin.sh "$REPO" "$TAG" "$ASSET"

      - name: Commit and push
        env:
          PLUGIN_ID: ${{ steps.manifest.outputs.plugin_id }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore: update $PLUGIN_ID plugin to v$VERSION"
          git push origin main

  # Pushes made with the workflow's token don't trigger other workflows, so deploy directly
  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
